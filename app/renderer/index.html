<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WorkspaceCleaner</title>
<style>
  /* 设计令牌与 miraquota 同源 */
  :root {
    --bg: #1b1b1f;
    --ink: rgba(255,255,255,.94); --ink2: rgba(255,255,255,.58); --ink3: rgba(255,255,255,.36);
    --card: rgba(255,255,255,.055); --cardbd: rgba(255,255,255,.075); --cardhi: rgba(255,255,255,.085);
    --track: rgba(255,255,255,.12); --bd: rgba(255,255,255,.1);
    --ok: #4cd471; --okbg: rgba(76,212,113,.14);
    --accent: #7aa2ff; --accent2: #a8c3ff; --accentbg: rgba(122,162,255,.16);
    --warn: #ffb04d; --warnbg: rgba(255,176,77,.15);
    --bad: #ff6f6f; --badbg: rgba(255,111,111,.16);
    --panel: rgba(0,0,0,.28);
    --selbar-bg: rgba(27,27,31,.92);
    /* 字阶：桌面工具（Fluent body 14 / macOS·VS Code 13 / M3 标签下限 11），不做网页 16px */
    --fs-title: 15px;
    --fs-body: 14px;
    --fs-ui: 13px;
    --fs-meta: 12px;
    --fs-micro: 11px;
    --lh: 1.5;
    --ctrl-h: 32px;
    --titlebar-h: 44px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f6;
      --ink: rgba(0,0,0,.88); --ink2: rgba(0,0,0,.54); --ink3: rgba(0,0,0,.36);
      --card: rgba(0,0,0,.035); --cardbd: rgba(0,0,0,.055); --cardhi: rgba(0,0,0,.06);
      --track: rgba(0,0,0,.09); --bd: rgba(0,0,0,.09);
      --ok: #1e9e50; --okbg: rgba(30,158,80,.11);
      --accent: #2f6bff; --accent2: #6d99ff; --accentbg: rgba(47,107,255,.1);
      --warn: #b26a05; --warnbg: rgba(178,106,5,.11);
      --bad: #d03333; --badbg: rgba(208,51,51,.1);
      --panel: rgba(0,0,0,.04);
      --selbar-bg: rgba(244,244,246,.94);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    display: flex; flex-direction: column;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: var(--fs-body); line-height: var(--lh);
    -webkit-font-smoothing: antialiased; user-select: none;
    font-variant-numeric: tabular-nums;
  }

  /* ---- 自绘标题栏 ---- */
  .titlebar {
    height: var(--titlebar-h); display: flex; align-items: center; gap: 8px;
    padding: 0 6px 0 14px; -webkit-app-region: drag; flex: none;
  }
  .titlebar .logo { width: 18px; height: 18px; flex: none; }
  .titlebar .name { font-weight: 600; font-size: var(--fs-title); letter-spacing: .2px; }
  .titlebar .ver { font-size: var(--fs-micro); color: var(--ink3); margin-left: -2px; }
  .titlebar .sp { flex: 1; }
  .tbtn {
    -webkit-app-region: no-drag; width: 36px; height: 32px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink2); font-size: var(--fs-ui); cursor: pointer;
  }
  .tbtn:hover { background: var(--track); color: var(--ink); }
  .tbtn.close:hover { background: var(--badbg); color: var(--bad); }
  .badge {
    -webkit-app-region: no-drag;
    font-size: var(--fs-micro); padding: 2px 8px; border-radius: 99px; font-weight: 600;
    background: var(--okbg); color: var(--ok);
  }
  .badge.busy { background: var(--accentbg); color: var(--accent); }
  .badge.busy::before {
    content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 5px; vertical-align: 0;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .badge.err { background: var(--badbg); color: var(--bad); }
  .badge.stale { background: var(--warnbg); color: var(--warn); }
  @keyframes pulse { 50% { opacity: .28; } }

  /* ---- 工具栏 ---- */
  .bars {
    -webkit-app-region: no-drag; position: relative; z-index: 20;
    display: flex; align-items: center; gap: 6px; margin: 0 14px 8px; flex: none;
  }
  .tabs {
    display: flex; gap: 2px; background: var(--card); border: .5px solid var(--cardbd);
    border-radius: 9px; padding: 2px;
  }
  .tabs button {
    flex: 1; border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer;
    background: transparent; color: var(--ink2); font: inherit; font-size: var(--fs-ui); font-weight: 600;
  }
  .tabs button.on { background: var(--accentbg); color: var(--accent); }
  .btn {
    border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer;
    background: var(--card); border: .5px solid var(--cardbd);
    color: var(--ink2); font: inherit; font-size: var(--fs-ui); font-weight: 600;
    -webkit-app-region: no-drag;
  }
  .btn:hover:not(:disabled) { background: var(--cardhi); color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accentbg); color: var(--accent); border-color: transparent; }
  .btn.danger { background: var(--badbg); color: var(--bad); border-color: transparent; }
  .btn.primary:hover:not(:disabled) { color: var(--accent2); }
  .btn.danger:hover:not(:disabled) { filter: brightness(1.12); }
  .btn.ghost { background: transparent; border-color: transparent; padding: 5px 8px; }

  /* ---- 过滤条 ---- */
  .filters {
    display: flex; align-items: center; gap: 6px; margin: 0 14px 8px;
    -webkit-app-region: no-drag; flex: none;
  }
  .search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
    background: var(--card); border: .5px solid var(--cardbd); border-radius: 9px;
    padding: 0 10px; height: var(--ctrl-h);
  }
  .search:focus-within { border-color: var(--accent); }
  .search .ico { color: var(--ink3); font-size: var(--fs-ui); flex: none; }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--ink); font: inherit; font-size: var(--fs-ui); user-select: text;
  }
  .search input::placeholder { color: var(--ink3); }
  .chips { display: flex; gap: 3px; flex: none; }
  .chip {
    border: 0; border-radius: 99px; padding: 4px 10px; cursor: pointer;
    background: transparent; color: var(--ink3); font: inherit; font-size: var(--fs-meta); font-weight: 600;
  }
  .chip:hover { color: var(--ink2); background: var(--card); }
  .chip.on { background: var(--accentbg); color: var(--accent); }
  /* 轮次下拉框 */
  select.turn-sel {
    flex: none; border: 0; border-radius: 9px; height: var(--ctrl-h); padding: 0 8px;
    background: var(--card); border: .5px solid var(--cardbd);
    color: var(--ink2); font: inherit; font-size: var(--fs-ui); font-weight: 600;
    outline: none; cursor: pointer;
  }
  select.turn-sel:hover { background: var(--cardhi); color: var(--ink); }
  select.turn-sel:focus-visible { outline: 1.5px solid var(--accent2); outline-offset: 1px; }
  select.turn-sel option { background: var(--bg); color: var(--ink); }

  /* ---- 布局：主区 + 右侧预览 ---- */
  .layout { display: flex; flex: 1; min-height: 0; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .scroll { flex: 1; overflow-y: auto; padding: 0 14px 56px; }
  .panel {
    width: min(420px, 42vw); flex: none; border-left: .5px solid var(--cardbd);
    background: var(--panel); overflow-y: auto;
    animation: slidein .18s ease;
  }
  @keyframes slidein { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---- 汇总条 ---- */
  .summary {
    display: flex; align-items: center; gap: 8px; margin: 0 14px 6px;
    font-size: var(--fs-meta); color: var(--ink3); flex: none;
  }
  .summary b { color: var(--ink2); font-weight: 600; }
  .summary .sp { flex: 1; }
  .summary .quick {
    border: 0; background: transparent; color: var(--accent); font: inherit;
    font-size: var(--fs-meta); font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 5px;
  }
  .summary .quick:hover { background: var(--accentbg); }
  .summary .quick:disabled { opacity: .35; cursor: default; }

  /* ---- 列表 ---- */
  .group { margin-bottom: 10px; }
  .group-head {
    display: flex; align-items: center; gap: 8px; padding: 5px 2px; cursor: pointer;
    font-size: var(--fs-ui); font-weight: 700; color: var(--ink2); letter-spacing: .3px;
  }
  .group-head .count { font-weight: 600; color: var(--ink3); font-size: var(--fs-meta); }
  .group-head .caret { color: var(--ink3); transition: transform .15s ease; width: 12px; }
  .group-head.collapsed .caret { transform: rotate(-90deg); }
  .group-head:hover { color: var(--ink); }
  .group-head .g-sel {
    margin-left: auto; border: 0; background: transparent; color: var(--accent);
    font: inherit; font-size: var(--fs-meta); font-weight: 600; cursor: pointer;
    padding: 2px 6px; border-radius: 5px;
  }
  .group-head .g-sel:hover { background: var(--accentbg); }

  .item {
    display: flex; align-items: flex-start; gap: 9px;
    background: var(--card); border: .5px solid var(--cardbd); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 6px;
    overflow: hidden;
    transition: background .12s ease, border-color .12s ease;
  }
  .item:hover { background: var(--cardhi); }
  .item.selected { border-color: rgba(122,162,255,.35); background: var(--accentbg); }
  .item.active {
    border-color: rgba(122,162,255,.45);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .item.clickable { cursor: pointer; }
  .item.locked { opacity: .55; }
  .item > input[type=checkbox] { margin-top: 3px; }
  .item .meta { flex: 1; min-width: 0; overflow: hidden; }
  .item .name {
    font-size: var(--fs-body); font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    min-width: 0; overflow: hidden;
  }
  .item .name .nm {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .snippet {
    font-size: var(--fs-ui); color: var(--ink2); margin-top: 3px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; white-space: normal; word-break: break-word;
  }
  .item .snippet.empty,
  .item .snippet.muted { color: var(--ink3); font-style: italic; }
  .item .sub {
    font-size: var(--fs-meta); color: var(--ink3); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .sub b { color: var(--ink2); font-weight: 500; }
  .item .turns { flex: none; color: var(--ink2); font-weight: 600; white-space: nowrap; }
  .tag {
    flex: none; font-size: var(--fs-micro); padding: 1px 6px; border-radius: 99px; font-weight: 600;
    background: var(--cardhi); color: var(--ink3);
  }
  .tag.wt { background: var(--accentbg); color: var(--accent); }
  .tag.idle { background: var(--warnbg); color: var(--warn); }
  .tag.busy { background: var(--badbg); color: var(--bad); }
  .tag.dirty { background: var(--warnbg); color: var(--warn); }
  .tag.ok { background: var(--okbg); color: var(--ok); }
  .item .right {
    flex: none; flex-shrink: 0; align-self: flex-start;
    display: flex; align-items: center; gap: 6px;
    font-size: var(--fs-meta); color: var(--ink3);
    padding-top: 1px;
  }
  /* 紧凑操作：列表行内 / 设置行内 / 预览底栏共用，勿只挂在 .item .right 下 */
  .act {
    border: 0; background: transparent; color: var(--ink2);
    font: inherit; font-size: var(--fs-ui); font-weight: 600; cursor: pointer;
    padding: 2px 6px; border-radius: 6px;
  }
  .act:hover { background: var(--track); color: var(--ink); }
  .act.del:hover { background: var(--badbg); color: var(--bad); }
  .act:disabled { opacity: .35; cursor: default; }
  .p-foot {
    padding: 10px 12px; border-top: .5px solid var(--cardbd);
    position: sticky; bottom: 0; background: var(--bg); z-index: 1;
  }
  .item .size { cursor: pointer; border-radius: 5px; padding: 1px 4px; }
  .item .size:hover { background: var(--track); color: var(--ink2); }

  .selbar {
    position: absolute; left: 14px; right: 14px; bottom: 22px;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 11px;
    background: var(--selbar-bg); border: .5px solid var(--cardbd);
    backdrop-filter: blur(10px); box-shadow: 0 8px 28px rgba(0,0,0,.22);
    font-size: var(--fs-ui); color: var(--accent); font-weight: 600;
    animation: slideup .16s ease;
    z-index: 5;
  }
  .selbar[hidden] { display: none; }
  @keyframes slideup { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .selbar .sp { flex: 1; }
  .selbar .hint { color: var(--ink3); font-weight: 400; font-size: var(--fs-meta); }

  .foot {
    font-size: var(--fs-meta); color: var(--ink3); padding: 2px 16px 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .foot b { color: var(--ink2); font-weight: 600; }
  .empty {
    text-align: center; color: var(--ink3); padding: 48px 16px 32px; font-size: var(--fs-body);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .empty .hint { font-size: var(--fs-ui); color: var(--ink3); max-width: 280px; line-height: 1.55; }

  /* ---- 预览面板 ---- */
  .panel .p-head {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
    border-bottom: .5px solid var(--cardbd); position: sticky; top: 0;
    background: var(--bg); z-index: 2;
  }
  .panel .p-title { font-weight: 700; font-size: var(--fs-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel .p-sub { font-size: var(--fs-micro); color: var(--ink3); margin-top: 1px; }
  .panel .p-close {
    margin-left: auto; border: 0; background: transparent; color: var(--ink2);
    font-size: var(--fs-body); cursor: pointer; padding: 3px 6px; border-radius: 6px; flex: none;
  }
  .panel .p-close:hover { background: var(--track); color: var(--ink); }
  .msg { padding: 8px 12px; border-bottom: .5px solid var(--cardbd); }
  .msg .m-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .m-role { font-size: var(--fs-micro); font-weight: 700; padding: 1px 6px; border-radius: 99px; }
  .m-role.user { background: var(--accentbg); color: var(--accent); }
  .m-role.assistant { background: var(--okbg); color: var(--ok); }
  .m-role.tool { background: var(--cardhi); color: var(--ink3); }
  .m-ts { font-size: var(--fs-micro); color: var(--ink3); }
  .msg .m-text {
    font-size: var(--fs-ui); color: var(--ink2); white-space: pre-wrap; word-break: break-word;
    user-select: text; max-height: 84px; overflow: hidden;
  }
  .msg .m-more {
    font-size: var(--fs-micro); color: var(--accent); cursor: pointer; margin-top: 2px; font-weight: 600;
    border: 0; background: transparent; padding: 0; font: inherit;
  }
  .msg .m-more:hover { color: var(--accent2); }
  .msg.open .m-text { max-height: none; }

  /* ---- 模态 ---- */
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
    display: flex; align-items: center; justify-content: center;
    animation: fadein .12s ease;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 460px; max-width: calc(100vw - 60px); max-height: 80vh; overflow-y: auto;
    background: var(--bg); border: .5px solid var(--cardbd); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.4); padding: 16px;
    animation: popin .16s ease;
  }
  @keyframes popin { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 { font-size: var(--fs-title); font-weight: 700; margin-bottom: 10px; }
  .modal .m-row { display: flex; align-items: center; gap: 8px; font-size: var(--fs-ui); padding: 4px 0; color: var(--ink2); }
  .modal .m-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
  .modal .m-list {
    background: var(--card); border: .5px solid var(--cardbd); border-radius: 9px;
    padding: 8px 10px; margin: 6px 0 10px; max-height: 220px; overflow-y: auto;
  }
  .modal .m-list .li { font-size: var(--fs-ui); color: var(--ink2); padding: 2px 0; }
  .modal .m-list .li b { color: var(--ink); font-weight: 600; }
  .modal .m-list .li .path { color: var(--ink3); font-size: var(--fs-micro); }
  .modal .m-warn {
    font-size: var(--fs-meta); color: var(--warn); background: var(--warnbg);
    border-radius: 7px; padding: 6px 9px; margin-bottom: 10px;
  }
  .modal .m-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .modal input[type=text], .modal input[type=number] {
    font: inherit; color: var(--ink); background: var(--cardhi);
    border: .5px solid var(--bd); border-radius: 7px; padding: 4px 8px; width: 100%;
    user-select: text; outline: none; transition: border-color .12s ease;
  }
  .modal input[type=text]:focus, .modal input[type=number]:focus { border-color: var(--accent); }
  .modal input[type=number]::-webkit-outer-spin-button,
  .modal input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .btn:focus-visible, .tbtn:focus-visible, .act:focus-visible, .chip:focus-visible, .quick:focus-visible {
    outline: 1.5px solid var(--accent2); outline-offset: 1px;
  }
  .modal .fld { margin-bottom: 10px; }
  .modal .fld .lbl { font-size: var(--fs-meta); color: var(--ink3); margin-bottom: 3px; }
  .modal .fld-row { display: flex; gap: 6px; }
  .modal .fld-row input { flex: 1; }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--cardhi); color: var(--ink); border: .5px solid var(--cardbd);
    border-radius: 9px; padding: 8px 14px; font-size: var(--fs-ui); z-index: 60;
    box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: min(480px, 90vw);
    animation: slideup .16s ease;
  }

  /* ---- 滚动条 ---- */
  * { scrollbar-width: thin; scrollbar-color: var(--track) transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--track); border-radius: 99px;
    border: 2px solid transparent; background-clip: padding-box; min-height: 36px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--ink3); border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:active {
    background: var(--ink2); border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-corner { background: transparent; }
  .scroll, .panel, .modal, .modal .m-list { scrollbar-gutter: stable; }

  /* ---- 勾选框 ---- */
  input[type=checkbox] {
    appearance: none; -webkit-appearance: none;
    width: 16px; height: 16px; flex: none;
    border: 1px solid var(--ink3); border-radius: 4px;
    background: transparent; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .12s ease, border-color .12s ease;
  }
  input[type=checkbox]:hover { border-color: var(--accent); }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after {
    content: ''; width: 8px; height: 5px;
    border-left: 1.6px solid #fff; border-bottom: 1.6px solid #fff;
    transform: rotate(-45deg) translate(0.5px, -1px);
  }
  input[type=checkbox]:disabled { opacity: .35; cursor: not-allowed; border-color: var(--ink3); }
  input[type=checkbox]:disabled:checked { background: var(--ink3); border-color: var(--ink3); }
  input[type=checkbox]:focus-visible { outline: 1.5px solid var(--accent2); outline-offset: 1px; }
  /* 自定义 display 会盖掉 UA 的 [hidden]{display:none}，必须显式压回去 */
  input[type=checkbox][hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="titlebar" id="titlebar">
    <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M6 9h20M9 9l1.2 16a2 2 0 0 0 2 1.9h7.6a2 2 0 0 0 2-1.9L23 9M13 12.5v9M19 12.5v9" stroke="#7aa2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="name">WorkspaceCleaner</span>
    <span class="ver" id="ver"></span>
    <span class="badge" id="state">就绪</span>
    <span class="sp"></span>
    <button class="tbtn" id="btnTheme" title="主题">◐</button>
    <button class="tbtn" id="btnMin" title="最小化">–</button>
    <button class="tbtn close" id="btnQuit" title="退出">✕</button>
  </div>

  <div class="bars">
    <div class="tabs" id="tabs">
      <button id="tabProj" class="on">项目</button>
      <button id="tabSess">会话</button>
    </div>
    <button class="btn" id="btnScan" title="重新扫描">⟳ 扫描</button>
    <button class="btn" id="btnClean" title="勾选所有超过清理阈值天数的会话">一键清理过期</button>
    <button class="btn" id="btnSettings" title="设置">⚙ 设置</button>
  </div>

  <div class="filters">
    <div class="search">
      <span class="ico" aria-hidden="true">⌕</span>
      <input type="search" id="q" placeholder="搜索名称 / 路径 / 分支…" autocomplete="off" spellcheck="false">
    </div>
    <div class="chips" id="chips"></div>
    <select class="turn-sel" id="turnSel" title="按轮次筛选（会话）" hidden>
      <option value="all">全部轮次</option>
      <option value="1">1 轮</option>
      <option value="2">2 轮</option>
      <option value="3">3 轮</option>
      <option value="4">4 轮</option>
      <option value="5">5 轮</option>
      <option value="6-9">6~9 轮</option>
      <option value="10+">10 轮以上</option>
      <option value="none">未知轮次</option>
    </select>
  </div>

  <div class="summary" id="summary"></div>

  <div class="layout">
    <div class="main">
      <div class="scroll" id="list"></div>
      <div class="selbar" id="selbar" hidden>
        <span id="selCount"></span>
        <span class="hint" id="selHint"></span>
        <span class="sp"></span>
        <button class="btn ghost" id="btnClearSel">清空</button>
        <button class="btn danger" id="btnDelSel" disabled>删除所选</button>
      </div>
      <div class="foot" id="foot"></div>
    </div>
    <div class="panel" id="panel" hidden></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

// ---------- 状态 ----------
let projects = [];
let sessions = [];
let settings = null;
let tab = 'proj';           // proj | sess
let selection = new Set();  // 已勾选的 item.id
let collapsed = new Set();  // 折叠的分组
let scanning = false;
let scanSummary = null;
let lastScanAt = null;
let filter = 'all';         // all | idle | wt | busy
let turnFilter = 'all';     // all | 1..5 | 6-9 | 10+ | none（会话轮次）
let query = '';
let renderQueued = false;
let activeModal = null;     // 当前打开的 mask，供 Escape 关闭
let previewOpenId = null;   // 当前预览的会话 id

const AGENT_LABEL = { pi: 'pi', claude: 'Claude', codex: 'Codex', orca: 'Orca' };
const AGENT_ORDER = ['pi', 'claude', 'codex', 'orca'];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// ---------- 主题 ----------
const THEME_ORDER = ['system', 'light', 'dark'];
const THEME_ICON = { system: '◐', light: '☀', dark: '☾' };
let theme = 'system';
function paintTheme() {
  $('btnTheme').textContent = THEME_ICON[theme] ?? '◐';
  const next = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
  $('btnTheme').title = `主题：${theme}（点击切到${next}）`;
}
$('btnTheme').onclick = async () => {
  const next = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
  theme = (await window.wsCleaner.setSettings({ theme: next }))?.theme ?? next;
  paintTheme();
};
$('btnMin').onclick = () => window.wsCleaner.minimize();
$('btnQuit').onclick = () => window.wsCleaner.quit();
$('titlebar').addEventListener('dblclick', (e) => {
  if (e.target.closest('button, .badge')) return;
  window.wsCleaner.maximize();
});

// ---------- 工具函数 ----------
const ago = (ts) => {
  if (ts == null) return '—';
  const d = Math.max(0, Date.now() / 1000 - ts);
  if (d < 90) return `${Math.round(d)} 秒前`;
  if (d < 5400) return `${Math.round(d / 60)} 分钟前`;
  if (d < 86400 * 2) return `${(d / 3600).toFixed(1)} 小时前`;
  return `${Math.round(d / 86400)} 天前`;
};
const daysOld = (ts) => ts == null ? null : Math.floor((Date.now() / 1000 - ts) / 86400);
const fmtBytes = (n) => {
  if (n == null) return '—';
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
  if (n < 1073741824) return `${(n / 1048576).toFixed(1)} MB`;
  return `${(n / 1073741824).toFixed(2)} GB`;
};
const uid = (it) => it.kind === 'session' ? `s:${it.agent}:${it.path}` : `p:${it.path}`;
// 仅「使用中」不可删；orca 可删但不可预览（README 拍板）
const locked = (it) => !!it.inUse;
const isWorktree = (it) => it.kind === 'worktree' || it.isWorktree;

function matchQuery(it, q) {
  if (!q) return true;
  const hay = [it.name, it.path, it.branch, it.cwd, it.mainRepo, it.agent, it.snippet]
    .filter(Boolean).join('\n').toLowerCase();
  return q.split(/\s+/).filter(Boolean).every((tok) => hay.includes(tok));
}

function visibleProjects() {
  let list = projects.slice();
  if (filter === 'idle') list = list.filter((p) => p.idle);
  else if (filter === 'wt') list = list.filter((p) => isWorktree(p));
  else if (filter === 'busy') list = list.filter((p) => p.inUse);
  if (query) list = list.filter((p) => matchQuery(p, query));
  // 清理优先：闲置 → 更旧 → 名称
  list.sort((a, b) => {
    if (a.idle !== b.idle) return a.idle ? -1 : 1;
    const aa = a.lastActivityAt ?? 0, bb = b.lastActivityAt ?? 0;
    if (aa !== bb) return aa - bb;
    return String(a.name).localeCompare(String(b.name), 'zh');
  });
  return list;
}

function matchTurn(s) {
  if (turnFilter === 'all') return true;
  const t = s.turnCount;
  if (turnFilter === 'none') return t == null;
  if (t == null) return false;
  if (turnFilter === '10+') return t >= 10;
  if (turnFilter === '6-9') return t >= 6 && t <= 9;
  return t === Number(turnFilter);
}

/** 流式扫描可能先推半成品（turnCount 为空）。已有轮次/摘要不要被盖掉。 */
function mergeSession(prev, next) {
  if (!prev) return next;
  const out = { ...next };
  if (out.turnCount == null && prev.turnCount != null) out.turnCount = prev.turnCount;
  if (!out.snippet && prev.snippet) out.snippet = prev.snippet;
  if (!out.cwd && prev.cwd) out.cwd = prev.cwd;
  return out;
}

function visibleSessions() {
  let list = sessions.slice();
  if (filter === 'idle') list = list.filter((s) => s.idle);
  else if (filter === 'busy') list = list.filter((s) => s.inUse);
  if (turnFilter !== 'all') list = list.filter(matchTurn);
  if (query) list = list.filter((s) => matchQuery(s, query));
  // 最近 → 更早
  list.sort((a, b) => (b.lastActivityAt ?? 0) - (a.lastActivityAt ?? 0));
  return list;
}

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

let turnSelOpen = false; // 原生下拉弹层开着时不要整页重绘，否则 Windows 会把 change 吃掉

// ---------- 渲染 ----------
function paintChips() {
  const chips = tab === 'proj'
    ? [['all', '全部'], ['idle', '闲置'], ['wt', 'worktree'], ['busy', '使用中']]
    : [['all', '全部'], ['idle', '闲置'], ['busy', '使用中']];
  if (tab === 'sess' && filter === 'wt') filter = 'all';
  const sel = $('turnSel');
  const wantHidden = tab !== 'sess';
  // 只有真正要变时才写 hidden：反复赋值会把 Windows 原生下拉弹层关掉且不一定触发 change
  if (sel.hidden !== wantHidden) sel.hidden = wantHidden;
  $('chips').innerHTML = chips.map(([k, lab]) =>
    `<button class="chip ${filter === k ? 'on' : ''}" data-filter="${k}">${lab}</button>`
  ).join('');
}

function projRows() {
  const rows = visibleProjects().map((p) => {
    const id = uid(p);
    const tags = [];
    if (isWorktree(p)) tags.push(`<span class="tag wt">worktree</span>`);
    if (p.inUse) tags.push(`<span class="tag busy">使用中</span>`);
    if (p.dirty) tags.push(`<span class="tag dirty">有改动</span>`);
    if (p.idle) {
      const d = daysOld(p.lastActivityAt);
      tags.push(`<span class="tag idle">闲置${d != null ? ` ${d} 天` : ''}</span>`);
    }
    const bits = [];
    if (p.branch) bits.push(`<b>${esc(p.branch)}</b>`);
    bits.push(`最后活动 ${ago(p.lastActivityAt)}`);
    if (p.sessionCount) bits.push(`${p.sessionCount} 个会话`);
    if (isWorktree(p) && p.mainRepo) bits.push(`主仓库 <b>${esc(p.mainRepo)}</b>`);
    return `<div class="item ${p.inUse ? 'locked' : ''} ${selection.has(id) ? 'selected' : ''}" data-id="${esc(id)}">
      <input type="checkbox" data-id="${esc(id)}" ${locked(p) ? 'disabled title="使用中，不可删除"' : ''} ${selection.has(id) ? 'checked' : ''}>
      <div class="meta">
        <div class="name"><span class="nm" title="${esc(p.path)}">${esc(p.name)}</span>${tags.join('')}</div>
        <span class="sub">${bits.join(' · ')}</span>
      </div>
      <div class="right">
        <span class="size" data-path="${esc(p.path)}" title="点按计算体积">体积 <span>${p.sizeBytes != null ? fmtBytes(p.sizeBytes) : '—'}</span></span>
        <button class="act del" data-del="${esc(id)}" ${locked(p) ? 'disabled' : ''} title="${isWorktree(p) ? '硬删 worktree' : '移入系统回收站'}">${isWorktree(p) ? '删除' : '回收站'}</button>
      </div>
    </div>`;
  });
  return rows.join('');
}

function sessGroups() {
  const byAgent = {};
  for (const s of visibleSessions()) { (byAgent[s.agent] ??= []).push(s); }
  const agents = [...AGENT_ORDER.filter((a) => byAgent[a]), ...Object.keys(byAgent).filter((a) => !AGENT_ORDER.includes(a))];
  return agents.map((agent) => {
    const list = byAgent[agent];
    const total = list.reduce((a, s) => a + (s.sizeBytes || 0), 0);
    const key = 'sess:' + agent;
    const isCollapsed = collapsed.has(key);
    const selectable = list.filter((s) => !locked(s));
    const allSelected = selectable.length > 0 && selectable.every((s) => selection.has(uid(s)));
    const rows = list.map((s) => {
      const id = uid(s);
      const tags = [];
      if (s.inUse) tags.push(`<span class="tag busy">使用中</span>`);
      if (s.idle) {
        const d = daysOld(s.lastActivityAt);
        tags.push(`<span class="tag idle">${d != null ? `${d} 天` : '闲置'}</span>`);
      }
      const turns = s.turnCount != null
        ? `<span class="turns">${s.turnCount} 轮</span>`
        : (s.previewable ? `<span class="turns">…</span>` : '');
      const snippet = s.snippet
        ? `<div class="snippet" title="${esc(s.snippet)}">${esc(s.snippet)}</div>`
        : (s.previewable ? '<div class="snippet muted">点击卡片查看对话</div>' : '<div class="snippet muted">orca · 不支持预览</div>');
      const sub = [
        `活动 ${ago(s.lastActivityAt)}`,
        fmtBytes(s.sizeBytes),
        s.cwd ? esc(s.cwd) : esc(s.path),
      ].join(' · ');
      const openAttr = s.previewable ? ` data-open-preview="${esc(id)}"` : '';
      const cls = [
        'item',
        s.inUse ? 'locked' : '',
        selection.has(id) ? 'selected' : '',
        s.previewable ? 'clickable' : '',
        previewOpenId === id ? 'active' : '',
      ].filter(Boolean).join(' ');
      return `<div class="${cls}" data-id="${esc(id)}"${openAttr}>
        <input type="checkbox" data-id="${esc(id)}" ${locked(s) ? 'disabled title="使用中，不可删除"' : ''} ${selection.has(id) ? 'checked' : ''}>
        <div class="meta">
          <div class="name"><span class="nm" title="${esc(s.path)}">${esc(s.name)}</span>${tags.join('')}${turns}</div>
          <span class="sub" title="${esc(s.path)}">${sub}</span>
          ${snippet}
        </div>
        <div class="right">
          <button class="act del" data-del="${esc(id)}" ${locked(s) ? 'disabled' : ''}>删除</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="group">
      <div class="group-head ${isCollapsed ? 'collapsed' : ''}" data-group="${esc(key)}">
        <span class="caret">▾</span><span>${AGENT_LABEL[agent] ?? agent}</span>
        <span class="count">${list.length} 个 · ${fmtBytes(total)}</span>
        ${selectable.length ? `<button class="g-sel" data-gsel="${esc(agent)}" title="全选/取消本组">${allSelected ? '取消全选' : '全选'}</button>` : ''}
      </div>
      <div class="group-body" ${isCollapsed ? 'hidden' : ''}>${rows || '<div class="empty">无</div>'}</div>
    </div>`;
  }).join('');
}

function render() {
  // 原生 <select> 下拉展开时整页 innerHTML 会把 Windows 上的 change 吃掉，冻住等关掉再画
  if (turnSelOpen) return;
  paintChips();
  const list = $('list');
  const source = tab === 'proj' ? projects : sessions;
  const shown = tab === 'proj' ? visibleProjects() : visibleSessions();
  const isEmpty = source.length === 0;
  const filteredOut = !isEmpty && shown.length === 0;

  if (isEmpty && scanning) {
    list.innerHTML = '<div class="empty">正在扫描……<span class="hint">首次扫描可能需要几十秒</span></div>';
  } else if (isEmpty) {
    list.innerHTML = `<div class="empty">没有发现条目
      <span class="hint">点击「扫描」重新扫描，或在设置里添加根目录</span>
      <button class="btn primary" id="emptyScan">开始扫描</button>
    </div>`;
    list.querySelector('#emptyScan')?.addEventListener('click', () => startScan(true));
  } else if (filteredOut) {
    list.innerHTML = `<div class="empty">没有匹配结果
      <span class="hint">试试清空搜索或切换筛选</span>
      <button class="btn" id="emptyReset">清除筛选</button>
    </div>`;
    list.querySelector('#emptyReset')?.addEventListener('click', () => {
      query = ''; filter = 'all'; turnFilter = 'all'; $('q').value = ''; $('turnSel').value = 'all'; scheduleRender();
    });
  } else {
    list.innerHTML = tab === 'proj' ? projRows() : sessGroups();
  }

  // 汇总
  const wt = projects.filter((p) => isWorktree(p)).length;
  const inUse = projects.filter((p) => p.inUse).length;
  const idleN = tab === 'proj'
    ? projects.filter((p) => p.idle && !p.inUse).length
    : sessions.filter((s) => s.idle && !s.inUse).length;
  const sumLeft = tab === 'proj'
    ? `<span><b>${projects.length}</b> 项目（含 <b>${wt}</b> worktree）· <b>${inUse}</b> 使用中 · <b>${projects.filter((p) => p.idle).length}</b> 闲置${query || filter !== 'all' ? ` · 显示 <b>${shown.length}</b>` : ''}</span>`
    : `<span><b>${sessions.length}</b> 会话 · <b>${sessions.filter((s) => s.inUse).length}</b> 使用中 · 共 <b>${fmtBytes(sessions.reduce((a, s) => a + (s.sizeBytes || 0), 0))}</b>${query || filter !== 'all' || turnFilter !== 'all' ? ` · 显示 <b>${shown.length}</b>` : ''}</span>`;
  $('summary').innerHTML = `${sumLeft}<span class="sp"></span>
    <button class="quick" id="btnSelAll" ${shown.some((i) => !locked(i)) ? '' : 'disabled'}>全选可见</button>
    <button class="quick" id="btnSelIdle" ${idleN ? '' : 'disabled'} title="勾选闲置且未使用中的项">勾选闲置 (${idleN})</button>`;
  $('btnSelAll').onclick = () => {
    for (const it of shown) if (!locked(it)) selection.add(uid(it));
    scheduleRender();
  };
  $('btnSelIdle').onclick = () => {
    const pool = tab === 'proj' ? projects : sessions;
    for (const it of pool) if (it.idle && !locked(it)) selection.add(uid(it));
    if (tab === 'proj') { filter = 'idle'; }
    scheduleRender();
  };

  // 选择条
  const sel = selectedItems();
  const n = sel.length;
  $('selbar').hidden = n === 0;
  if (n) {
    const nProj = sel.filter((i) => i.kind === 'project' && !isWorktree(i)).length;
    const nWt = sel.filter((i) => isWorktree(i)).length;
    const nSess = sel.filter((i) => i.kind === 'session').length;
    const parts = [];
    if (nProj) parts.push(`项目 ${nProj}`);
    if (nWt) parts.push(`worktree ${nWt}`);
    if (nSess) parts.push(`会话 ${nSess}`);
    $('selCount').textContent = `已选 ${n} 项（${parts.join(' · ')}）`;
    $('selHint').textContent = nProj ? '项目 → 系统回收站' : (nWt ? 'worktree 硬删' : '会话硬删');
    $('btnDelSel').disabled = false;
  } else {
    $('btnDelSel').disabled = true;
  }

  // 一键清理：项目页也可点，会跳到会话页
  $('btnClean').disabled = !settings;

  // 页脚
  const foot = [];
  if (scanSummary) foot.push(`${scanSummary.projects} 项目 · ${scanSummary.worktrees} worktree · ${scanSummary.sessions} 会话`);
  if (lastScanAt) foot.push(`扫描于 ${ago(Math.floor(lastScanAt / (lastScanAt > 1e12 ? 1000 : 1)))}`);
  if (settings) foot.push(`闲置 ${settings.idleDays} 天 · 清理 ${settings.cleanupDays} 天`);
  $('foot').innerHTML = foot.join(' · ');
}

function selectedItems() {
  return [...selection].map((id) => findItem(id)).filter(Boolean);
}
function findItem(id) {
  for (const p of projects) if (uid(p) === id) return p;
  for (const s of sessions) if (uid(s) === id) return s;
  return null;
}

function setTab(next) {
  tab = next;
  if (tab === 'proj' && turnFilter !== 'all') { turnFilter = 'all'; $('turnSel').value = 'all'; }
  $('tabProj').classList.toggle('on', tab === 'proj');
  $('tabSess').classList.toggle('on', tab === 'sess');
  scheduleRender();
}

// ---------- 事件委托 ----------
$('chips').addEventListener('click', (e) => {
  const c = e.target.closest('[data-filter]');
  if (!c) return;
  filter = c.dataset.filter;
  scheduleRender();
});

let qTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    query = $('q').value.trim().toLowerCase();
    scheduleRender();
  }, 120);
});

$('turnSel').addEventListener('mousedown', () => { turnSelOpen = true; });
$('turnSel').addEventListener('change', onTurnChange);
$('turnSel').addEventListener('input', onTurnChange);
$('turnSel').addEventListener('blur', () => {
  turnSelOpen = false;
  onTurnChange();
  scheduleRender();
});
function onTurnChange() {
  const v = $('turnSel').value;
  turnSelOpen = false;
  if (v === turnFilter) return;
  turnFilter = v;
  scheduleRender();
}

$('list').addEventListener('click', async (e) => {
  const gsel = e.target.closest('[data-gsel]');
  if (gsel) {
    e.stopPropagation();
    const agent = gsel.dataset.gsel;
    const list = visibleSessions().filter((s) => s.agent === agent && !locked(s));
    const allOn = list.length && list.every((s) => selection.has(uid(s)));
    for (const s of list) {
      if (allOn) selection.delete(uid(s));
      else selection.add(uid(s));
    }
    scheduleRender();
    return;
  }
  const cb = e.target.closest('input[type=checkbox]');
  if (cb) {
    const id = cb.dataset.id;
    if (cb.checked) selection.add(id); else selection.delete(id);
    scheduleRender();
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    const it = findItem(del.dataset.del);
    if (it) await requestDelete([it]);
    return;
  }
  // 勾选 / 删除 / 分组头以外，点击可预览会话卡片即打开侧栏
  const openPv = e.target.closest('[data-open-preview]');
  if (openPv) {
    const it = findItem(openPv.dataset.openPreview);
    if (it) openPreview(it);
    return;
  }
  const gh = e.target.closest('[data-group]');
  if (gh && !e.target.closest('[data-gsel]')) {
    const key = gh.dataset.group;
    if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
    scheduleRender();
    return;
  }
  const sizeEl = e.target.closest('.size');
  if (sizeEl && !sizeEl.dataset.done) {
    sizeEl.dataset.done = '1';
    const p = projects.find((x) => x.path === sizeEl.dataset.path);
    if (p) {
      sizeEl.innerHTML = '计算中…';
      try {
        p.sizeBytes = await window.wsCleaner.size(p.path);
        scheduleRender();
      } catch { sizeEl.dataset.done = ''; sizeEl.innerHTML = '体积 <span>—</span>'; }
    }
  }
});

$('btnClearSel').onclick = () => { selection.clear(); scheduleRender(); };
$('btnDelSel').onclick = async () => {
  const items = selectedItems().filter((i) => !locked(i));
  if (items.length) await requestDelete(items);
};

// ---------- 删除流程 ----------
async function requestDelete(items) {
  const projectsList = items.filter((i) => i.kind === 'project' && !isWorktree(i));
  const worktrees = items.filter((i) => isWorktree(i));
  const sessList = items.filter((i) => i.kind === 'session');

  const needConfirm = projectsList.length > 0 || (worktrees.length + sessList.length > 0 && !settings.skipConfirm);
  let force = false;

  if (needConfirm) {
    const res = await openConfirmModal({ items, projectsList, worktrees, sessions: sessList });
    if (!res) return;
    force = res.force;
  }

  const payload = items.map((it) => {
    if (isWorktree(it)) {
      return {
        kind: 'worktree', path: it.path, name: it.name,
        mainRepo: it.mainRepo, dirty: it.dirty, force,
      };
    }
    if (it.kind === 'session') {
      return { kind: 'session', path: it.path, name: it.name, agent: it.agent, dir: it.dir, lastActivityAt: it.lastActivityAt };
    }
    return { kind: 'project', path: it.path, name: it.name };
  });

  setState('处理中…', 'busy');
  const results = await window.wsCleaner.deleteItems(payload);
  const okPaths = new Set(results.filter((r) => r.ok).map((r) => r.item.path));
  if (okPaths.size) {
    projects = projects.filter((p) => !okPaths.has(p.path));
    sessions = sessions.filter((s) => !okPaths.has(s.path));
    for (const p of okPaths) {
      selection.delete(`p:${p}`);
      for (const a of Object.keys(AGENT_LABEL)) selection.delete(`s:${a}:${p}`);
    }
  }
  const fails = results.filter((r) => !r.ok);
  if (fails.length) {
    setState(`${fails.length} 项失败`, 'err');
    toast(fails.map((f) => `✗ ${esc(f.item.name)}: ${esc(f.message)}`).join('<br>'));
  } else {
    setState(`已删除 ${results.length} 项`, 'ok');
    toast(`已删除 ${results.length} 项`);
  }
  scheduleRender();
}

function openConfirmModal({ items, projectsList, worktrees, sessions: sessList }) {
  return new Promise((resolve) => {
    const mask = document.createElement('div');
    mask.className = 'mask';
    const hasProjects = projectsList.length > 0;
    const dirtyWts = worktrees.filter((w) => w.dirty);
    const hasDirty = dirtyWts.length > 0;
    const listHtml = items.map((it) => {
      const kindTag = isWorktree(it)
        ? ' <span class="tag dirty">硬删</span>'
        : it.kind === 'project'
          ? ' <span class="tag ok">→回收站</span>'
          : ' <span class="tag">硬删</span>';
      return `<div class="li"><b>${esc(it.name)}</b> <span class="path">${esc(it.path)}</span>${isWorktree(it) && it.dirty ? ' <span class="tag dirty">有改动</span>' : ''}${kindTag}</div>`;
    }).join('');

    const warnings = [];
    if (hasProjects) warnings.push(`项目删除将<b>移入系统回收站</b>（可恢复）。若有登记在案的 worktree，会一并移入回收站。`);
    if (hasDirty) warnings.push(`有 <b>${dirtyWts.length}</b> 个工作树存在未提交改动，删除会丢弃这些改动。`);

    mask.innerHTML = `<div class="modal">
      <h3>确认删除 ${items.length} 项？</h3>
      ${warnings.map((w) => `<div class="m-warn">${w}</div>`).join('')}
      <div class="m-list">${listHtml}</div>
      ${hasDirty ? `<div class="m-row"><label><input type="checkbox" id="cForce"> 强制删除有改动的工作树（丢弃未提交改动）</label></div>` : ''}
      ${hasProjects ? `<div class="m-row"><label><input type="checkbox" id="cConfirm"> <b style="color:var(--bad)">我确认删除这些项目（将移入系统回收站）</b></label></div>` : ''}
      <div class="m-btns">
        <button class="btn" id="mCancel">取消</button>
        <button class="btn danger" id="mOk" disabled>删除</button>
      </div>
    </div>`;
    document.body.appendChild(mask);
    activeModal = mask;

    const okBtn = mask.querySelector('#mOk');
    const cConfirm = mask.querySelector('#cConfirm');
    const cForce = mask.querySelector('#cForce');
    const check = () => {
      let ok = true;
      if (hasProjects && !cConfirm?.checked) ok = false;
      if (hasDirty && !cForce?.checked) ok = false;
      okBtn.disabled = !ok;
    };
    cConfirm?.addEventListener('change', check);
    cForce?.addEventListener('change', check);
    check();

    const close = (val) => {
      if (activeModal === mask) activeModal = null;
      mask.remove();
      resolve(val);
    };
    mask.querySelector('#mCancel').onclick = () => close(null);
    okBtn.onclick = () => close({ force: cForce?.checked ?? false });
    mask.addEventListener('mousedown', (e) => { if (e.target === mask) close(null); });
  });
}

// ---------- 预览 ----------
function bindPreviewClose(panel) {
  const close = () => {
    panel.hidden = true;
    previewOpenId = null;
    scheduleRender();
  };
  $('pClose').onclick = close;
  return close;
}

async function openPreview(item) {
  const panel = $('panel');
  const id = uid(item);
  previewOpenId = id;
  panel.hidden = false;
  scheduleRender();
  panel.innerHTML = '<div class="p-head"><div><div class="p-title">加载中…</div></div><button class="p-close" id="pClose">✕</button></div>';
  bindPreviewClose(panel);
  const data = await window.wsCleaner.preview(item.path, item.agent).catch((e) => ({ previewable: false, message: String(e) }));
  // 用户可能已点开另一条会话
  if (previewOpenId !== id) return;
  if (!data?.previewable) {
    panel.innerHTML = `<div class="p-head"><div><div class="p-title">${esc(item.name)}</div></div><button class="p-close" id="pClose">✕</button></div>
      <div class="empty">${esc(data?.message || '无法预览')}</div>`;
    bindPreviewClose(panel);
    return;
  }
  const turns = data.turnCount != null ? ` · ${data.turnCount} 轮` : '';
  const hd = `<div class="p-head">
    <div>
      <div class="p-title">${esc(item.name)} <span class="tag">${AGENT_LABEL[item.agent]}</span></div>
      <div class="p-sub">${esc(data.path || '')}${data.cwd ? `<br>工作目录 <b>${esc(data.cwd)}</b>` : ''}</div>
      <div class="p-sub">${data.messageCount} 条消息${turns} · ${data.startAt ? '开始 ' + esc(data.startAt) : ''} · ${data.endAt ? '结束 ' + esc(data.endAt) : ''}</div>
    </div>
    <button class="p-close" id="pClose" title="关闭">✕</button>
  </div>`;
  const msgs = (data.messages ?? []).map((m, i) => {
    const long = (m.text || '').length > 280 || (m.text || '').split('\n').length > 5;
    return `
    <div class="msg" data-msg="${i}">
      <div class="m-head"><span class="m-role ${m.role === 'user' ? 'user' : m.role === 'tool' ? 'tool' : 'assistant'}">${esc(m.role)}</span><span class="m-ts">${esc(m.ts || '')}</span></div>
      <div class="m-text">${esc(m.text)}</div>
      ${long ? `<button class="m-more" type="button">展开全文</button>` : ''}
    </div>`;
  }).join('');
  panel.innerHTML = hd + msgs + '<div class="p-foot"><button class="btn" id="pReveal">在资源管理器中显示</button></div>';
  bindPreviewClose(panel);
  $('pReveal').onclick = () => window.wsCleaner.reveal(item.path);
  panel.onclick = (e) => {
    const more = e.target.closest('.m-more');
    if (!more) return;
    const msg = more.closest('.msg');
    msg.classList.toggle('open');
    more.textContent = msg.classList.contains('open') ? '收起' : '展开全文';
  };
}

function closePanel() {
  const panel = $('panel');
  if (!panel.hidden) {
    panel.hidden = true;
    previewOpenId = null;
    scheduleRender();
  }
}

// ---------- 一键清理 ----------
$('btnClean').onclick = async () => {
  if (!settings) return;
  setTab('sess');
  const limit = settings.cleanupDays * 86400;
  const old = sessions.filter((s) => s.lastActivityAt != null && Date.now() / 1000 - s.lastActivityAt > limit && !s.inUse);
  if (!old.length) { toast(`没有超过 ${settings.cleanupDays} 天的可删会话`); return; }
  selection = new Set(old.map((s) => uid(s)));
  filter = 'all';
  turnFilter = 'all';
  $('turnSel').value = 'all';
  query = '';
  $('q').value = '';
  scheduleRender();
  toast(`已勾选 ${old.length} 个超过 ${settings.cleanupDays} 天的会话，点击「删除所选」`);
};

// ---------- 设置 ----------
$('btnSettings').onclick = () => openSettingsModal();
function openSettingsModal() {
  const draft = {
    roots: [...(settings.roots || [])],
    sessionRoots: structuredClone(settings.sessionRoots || {}),
    idleDays: settings.idleDays,
    cleanupDays: settings.cleanupDays,
    inUseMin: settings.inUseMin,
    skipConfirm: settings.skipConfirm,
  };
  const mask = document.createElement('div');
  mask.className = 'mask';
  activeModal = mask;

  const paint = () => {
    const sr = draft.sessionRoots;
    const rootsList = draft.roots.map((r, i) =>
      `<div class="m-row"><span style="flex:1;overflow:hidden;text-overflow:ellipsis" title="${esc(r)}">${esc(r)}</span><button class="btn" data-rmroot="${i}">移除</button></div>`
    ).join('') || '<div class="m-row" style="color:var(--ink3)">尚未添加根目录</div>';
    mask.innerHTML = `<div class="modal" style="width:520px">
      <h3>设置</h3>
      <div class="fld"><div class="lbl">扫描根目录（找 git 项目/worktree）</div>
        ${rootsList}
        <div class="fld-row"><input type="text" id="setRoot" placeholder="如 D:\\work"><button class="btn" id="addRoot">添加</button></div>
      </div>
      <div class="fld"><div class="lbl">会话存储</div>
        ${Object.entries(sr).map(([agent, cfg]) =>
          `<div class="m-row"><label><input type="checkbox" data-agent="${agent}" ${cfg.enabled ? 'checked' : ''}> ${AGENT_LABEL[agent] ?? agent}</label><span style="font-size:var(--fs-micro);color:var(--ink3);overflow:hidden;text-overflow:ellipsis" title="${esc(cfg.path)}">${esc(cfg.path)}</span></div>`
        ).join('')}
      </div>
      <div class="fld"><div class="lbl">闲置阈值（天，仅标记不自动删）</div>
        <input type="number" id="setIdle" min="1" value="${draft.idleDays}"></div>
      <div class="fld"><div class="lbl">一键清理阈值（天，勾选更老的会话）</div>
        <input type="number" id="setClean" min="1" value="${draft.cleanupDays}"></div>
      <div class="fld"><div class="lbl">使用中判定窗口（分钟）</div>
        <input type="number" id="setInUse" min="1" value="${draft.inUseMin}"></div>
      <div class="m-row"><label><input type="checkbox" id="setSkip" ${draft.skipConfirm ? 'checked' : ''}> 删除前不再二次确认（仅 worktree / 会话；项目删除始终要确认）</label></div>
      <div class="m-btns">
        <button class="btn" id="mCancel">取消</button>
        <button class="btn primary" id="mSave">保存并重扫</button>
      </div>
    </div>`;

    mask.querySelector('#addRoot').onclick = () => {
      const v = mask.querySelector('#setRoot').value.trim();
      if (v && !draft.roots.includes(v)) { draft.roots.push(v); paint(); }
    };
    mask.querySelectorAll('[data-rmroot]').forEach((b) => {
      b.onclick = () => { draft.roots.splice(Number(b.dataset.rmroot), 1); paint(); };
    });
    mask.querySelector('#mCancel').onclick = () => {
      if (activeModal === mask) activeModal = null;
      mask.remove();
    };
    mask.querySelector('#mSave').onclick = async () => {
      const newSr = {};
      for (const [agent, cfg] of Object.entries(draft.sessionRoots)) {
        const el = mask.querySelector(`[data-agent="${agent}"]`);
        newSr[agent] = { ...cfg, enabled: el?.checked ?? cfg.enabled };
      }
      settings = await window.wsCleaner.setSettings({
        roots: draft.roots,
        sessionRoots: newSr,
        idleDays: Number(mask.querySelector('#setIdle').value) || 90,
        cleanupDays: Number(mask.querySelector('#setClean').value) || 30,
        inUseMin: Number(mask.querySelector('#setInUse').value) || 15,
        skipConfirm: mask.querySelector('#setSkip').checked,
      });
      if (activeModal === mask) activeModal = null;
      mask.remove();
      startScan(true);
    };
  };
  paint();
  document.body.appendChild(mask);
  mask.addEventListener('mousedown', (e) => {
    if (e.target === mask) {
      if (activeModal === mask) activeModal = null;
      mask.remove();
    }
  });
}

// ---------- 扫描 ----------
function setState(label, cls = '') {
  const st = $('state');
  st.textContent = label;
  st.className = 'badge' + (cls ? ' ' + cls : '');
}
function startScan(force = false) {
  scanning = true;
  if (force) {
    // 强制重扫时清空列表，避免旧数据与新推送交错
    projects = [];
    sessions = [];
    selection.clear();
  }
  setState('扫描中…', 'busy');
  scheduleRender();
  window.wsCleaner.scanStart();
}
$('btnScan').onclick = () => startScan(true);
$('tabProj').onclick = () => setTab('proj');
$('tabSess').onclick = () => setTab('sess');

window.wsCleaner.onCache((c) => {
  if (c?.projects) projects = c.projects;
  if (c?.sessions) sessions = c.sessions;
  lastScanAt = c?.summary?.scannedAt ?? null;
  scanSummary = c?.summary ?? null;
  scheduleRender();
});
window.wsCleaner.onBatch(({ kind, items }) => {
  if (kind === 'projects') {
    for (const it of items) {
      const i = projects.findIndex((x) => x.path === it.path);
      if (i >= 0) projects[i] = it; else projects.push(it);
    }
  } else if (kind === 'sessions') {
    for (const it of items) {
      const i = sessions.findIndex((x) => x.agent === it.agent && x.path === it.path);
      if (i >= 0) sessions[i] = mergeSession(sessions[i], it); else sessions.push(it);
    }
  }
  scheduleRender();
});
window.wsCleaner.onDone((p) => {
  scanning = false;
  lastScanAt = p.scannedAt;
  scanSummary = p.summary;
  // 全量结果以缓存为准：结束时再读一遍更稳，但 done 只带 summary；
  // 流式推送已覆盖，这里只更新状态。
  setState(`就绪 · ${p.summary.projects} 项目 / ${p.summary.sessions} 会话`, 'ok');
  scheduleRender();
});
window.wsCleaner.onError((p) => {
  scanning = false;
  setState('扫描出错', 'err');
  toast('扫描出错：' + esc(p.message));
});

// ---------- toast / 快捷键 ----------
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (activeModal) {
      activeModal.remove();
      activeModal = null;
      return;
    }
    closePanel();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    const shown = tab === 'proj' ? visibleProjects() : visibleSessions();
    for (const it of shown) if (!locked(it)) selection.add(uid(it));
    scheduleRender();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    $('q').focus();
    $('q').select();
  }
});

// ---------- 启动 ----------
(async () => {
  settings = await window.wsCleaner.settings();
  theme = settings.theme ?? 'system';
  paintTheme();
  window.wsCleaner.version?.().then((v) => { if (v) $('ver').textContent = 'v' + v; }).catch(() => {});
  startScan(false);
})();
</script>
