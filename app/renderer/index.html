<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WorkspaceCleaner</title>
<style>
  /* 设计令牌与 miraquota 同源 */
  :root {
    --bg: #1b1b1f;
    --ink: rgba(255,255,255,.94); --ink2: rgba(255,255,255,.58); --ink3: rgba(255,255,255,.36);
    --card: rgba(255,255,255,.055); --cardbd: rgba(255,255,255,.075); --cardhi: rgba(255,255,255,.085);
    --track: rgba(255,255,255,.12); --bd: rgba(255,255,255,.1);
    --ok: #4cd471; --okbg: rgba(76,212,113,.14);
    --accent: #7aa2ff; --accent2: #a8c3ff; --accentbg: rgba(122,162,255,.16);
    --warn: #ffb04d; --warnbg: rgba(255,176,77,.15);
    --bad: #ff6f6f; --badbg: rgba(255,111,111,.16);
    --panel: rgba(0,0,0,.28);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f6;
      --ink: rgba(0,0,0,.88); --ink2: rgba(0,0,0,.54); --ink3: rgba(0,0,0,.36);
      --card: rgba(0,0,0,.035); --cardbd: rgba(0,0,0,.055); --cardhi: rgba(0,0,0,.06);
      --track: rgba(0,0,0,.09); --bd: rgba(0,0,0,.09);
      --ok: #1e9e50; --okbg: rgba(30,158,80,.11);
      --accent: #2f6bff; --accent2: #6d99ff; --accentbg: rgba(47,107,255,.1);
      --warn: #b26a05; --warnbg: rgba(178,106,5,.11);
      --bad: #d03333; --badbg: rgba(208,51,51,.1);
      --panel: rgba(0,0,0,.06);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 12px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; user-select: none;
    font-variant-numeric: tabular-nums;
  }

  /* ---- 自绘标题栏 ---- */
  .titlebar {
    height: 40px; display: flex; align-items: center; gap: 8px;
    padding: 0 6px 0 14px; -webkit-app-region: drag;
  }
  .titlebar .logo { width: 16px; height: 16px; }
  .titlebar .name { font-weight: 600; font-size: 13px; letter-spacing: .2px; }
  .titlebar .ver { font-size: 10.5px; color: var(--ink3); margin-left: -2px; }
  .titlebar .sp { flex: 1; }
  .tbtn {
    -webkit-app-region: no-drag; width: 34px; height: 28px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink2); font-size: 13px; cursor: pointer;
  }
  .tbtn:hover { background: var(--track); color: var(--ink); }
  .badge {
    font-size: 10.5px; padding: 2px 8px; border-radius: 99px; font-weight: 600;
    background: var(--okbg); color: var(--ok);
  }
  .badge.busy { background: var(--accentbg); color: var(--accent); }
  .badge.err { background: var(--badbg); color: var(--bad); }
  .badge.stale { background: var(--warnbg); color: var(--warn); }

  /* ---- 工具栏 ---- */
  .bars { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 6px; margin: 0 14px 8px; }
  .tabs {
    display: flex; gap: 2px; background: var(--card); border: .5px solid var(--cardbd);
    border-radius: 9px; padding: 2px;
  }
  .tabs button {
    flex: 1; border: 0; border-radius: 7px; padding: 5px 14px; cursor: pointer;
    background: transparent; color: var(--ink2); font: inherit; font-size: 11.5px; font-weight: 600;
  }
  .tabs button.on { background: var(--accentbg); color: var(--accent); }
  .btn {
    border: 0; border-radius: 7px; padding: 5px 12px; cursor: pointer;
    background: var(--card); border: .5px solid var(--cardbd);
    color: var(--ink2); font: inherit; font-size: 11.5px; font-weight: 600;
    -webkit-app-region: no-drag;
  }
  .btn:hover:not(:disabled) { background: var(--cardhi); color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accentbg); color: var(--accent); }
  .btn.danger { background: var(--badbg); color: var(--bad); }
  .btn.primary:hover:not(:disabled) { color: var(--accent2); }
  .btn.danger:hover:not(:disabled) { filter: brightness(1.15); }

  /* ---- 布局：主区 + 右侧预览 ---- */
  .layout { display: flex; height: calc(100% - 78px); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; padding: 0 14px 10px; }
  .panel {
    width: 420px; flex: none; border-left: .5px solid var(--cardbd);
    background: var(--panel); overflow-y: auto;
    animation: slidein .18s ease;
  }
  @keyframes slidein { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---- 汇总条 ---- */
  .summary { display: flex; gap: 6px; margin: 0 14px 8px; font-size: 10.5px; color: var(--ink3); }
  .summary b { color: var(--ink2); font-weight: 600; }

  /* ---- 列表 ---- */
  .group { margin-bottom: 10px; }
  .group-head {
    display: flex; align-items: center; gap: 8px; padding: 5px 2px; cursor: pointer;
    font-size: 11px; font-weight: 700; color: var(--ink2); letter-spacing: .3px;
  }
  .group-head .count { font-weight: 600; color: var(--ink3); font-size: 10.5px; }
  .group-head .caret { color: var(--ink3); transition: transform .15s ease; }
  .group-head.collapsed .caret { transform: rotate(-90deg); }
  .group-head:hover { color: var(--ink); }

  .item {
    display: flex; align-items: center; gap: 9px;
    background: var(--card); border: .5px solid var(--cardbd); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .item:hover { background: var(--cardhi); }
  .item.locked { opacity: .5; }
  .item input[type=checkbox] { flex: none; width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
  .item input[type=checkbox]:disabled { cursor: not-allowed; }
  .item .meta { flex: 1; min-width: 0; }
  .item .name { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .item .name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { font-size: 10.5px; color: var(--ink3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub b { color: var(--ink2); font-weight: 500; }
  .tag {
    flex: none; font-size: 9.5px; padding: 1px 6px; border-radius: 99px; font-weight: 600;
    background: var(--cardhi); color: var(--ink3);
  }
  .tag.wt { background: var(--accentbg); color: var(--accent); }
  .tag.idle { background: var(--warnbg); color: var(--warn); }
  .tag.busy { background: var(--badbg); color: var(--bad); }
  .tag.dirty { background: var(--warnbg); color: var(--warn); }
  .tag.ok { background: var(--okbg); color: var(--ok); }
  .item .right { flex: none; display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink3); }
  .item .right .act {
    border: 0; background: transparent; color: var(--ink2); font-size: 11px; cursor: pointer;
    padding: 2px 5px; border-radius: 6px; font-weight: 600;
  }
  .item .right .act:hover { background: var(--track); color: var(--ink); }
  .item .right .act.del:hover { background: var(--badbg); color: var(--bad); }
  .item .right .act:disabled { opacity: .35; cursor: default; }

  .selbar {
    display: flex; align-items: center; gap: 8px; margin: 0 14px 8px; font-size: 11px;
    color: var(--accent); font-weight: 600;
  }
  .selbar .sp { flex: 1; }
  .selbar .hint { color: var(--ink3); font-weight: 400; }

  .foot { font-size: 10.5px; color: var(--ink3); padding: 0 2px 2px; }
  .foot b { color: var(--ink2); font-weight: 600; }
  .empty { text-align: center; color: var(--ink3); padding: 40px 0 24px; font-size: 12px; }

  /* ---- 预览面板 ---- */
  .panel .p-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: .5px solid var(--cardbd); position: sticky; top: 0;
    background: var(--bg); z-index: 2;
  }
  .panel .p-title { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel .p-sub { font-size: 10px; color: var(--ink3); margin-top: 1px; }
  .panel .p-close {
    margin-left: auto; border: 0; background: transparent; color: var(--ink2);
    font-size: 12px; cursor: pointer; padding: 3px 6px; border-radius: 6px;
  }
  .panel .p-close:hover { background: var(--track); color: var(--ink); }
  .msg { padding: 8px 12px; border-bottom: .5px solid var(--cardbd); }
  .msg .m-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .m-role { font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }
  .m-role.user { background: var(--accentbg); color: var(--accent); }
  .m-role.assistant { background: var(--okbg); color: var(--ok); }
  .m-role.tool { background: var(--cardhi); color: var(--ink3); }
  .m-ts { font-size: 9.5px; color: var(--ink3); }
  .msg .m-text {
    font-size: 11px; color: var(--ink2); white-space: pre-wrap; word-break: break-word;
    user-select: text; max-height: 84px; overflow: hidden;
  }
  .msg .m-more {
    font-size: 10px; color: var(--accent); cursor: pointer; margin-top: 2px; font-weight: 600;
  }
  .msg.open .m-text { max-height: none; }

  /* ---- 模态 ---- */
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    width: 460px; max-width: calc(100vw - 60px); max-height: 80vh; overflow-y: auto;
    background: var(--bg); border: .5px solid var(--cardbd); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.4); padding: 16px;
  }
  .modal h3 { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .modal .m-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; padding: 4px 0; color: var(--ink2); }
  .modal .m-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
  .modal .m-row input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; }
  .modal .m-list { background: var(--card); border: .5px solid var(--cardbd); border-radius: 9px; padding: 8px 10px; margin: 6px 0 10px; max-height: 220px; overflow-y: auto; }
  .modal .m-list .li { font-size: 11px; color: var(--ink2); padding: 2px 0; }
  .modal .m-list .li b { color: var(--ink); font-weight: 600; }
  .modal .m-list .li .path { color: var(--ink3); font-size: 10px; }
  .modal .m-warn { font-size: 10.5px; color: var(--warn); background: var(--warnbg); border-radius: 7px; padding: 6px 9px; margin-bottom: 10px; }
  .modal .m-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .modal input[type=text], .modal input[type=number] {
    font: inherit; color: var(--ink); background: var(--cardhi);
    border: .5px solid var(--bd); border-radius: 7px; padding: 4px 8px; width: 100%;
    user-select: text;
  }
  .modal .fld { margin-bottom: 10px; }
  .modal .fld .lbl { font-size: 10.5px; color: var(--ink3); margin-bottom: 3px; }
  .modal .fld-row { display: flex; gap: 6px; }
  .modal .fld-row input { flex: 1; }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--cardhi); color: var(--ink); border: .5px solid var(--cardbd);
    border-radius: 9px; padding: 8px 14px; font-size: 11.5px; z-index: 60;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 32 32" fill="none">
      <path d="M6 9h20M9 9l1.2 16a2 2 0 0 0 2 1.9h7.6a2 2 0 0 0 2-1.9L23 9M13 12.5v9M19 12.5v9" stroke="#7aa2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="name">WorkspaceCleaner</span>
    <span class="ver" id="ver"></span>
    <span class="badge" id="state">就绪</span>
    <span class="sp"></span>
    <button class="tbtn" id="btnTheme" title="主题">◐</button>
    <button class="tbtn" id="btnMin" title="最小化">–</button>
    <button class="tbtn" id="btnQuit" title="退出">✕</button>
  </div>

  <div class="bars">
    <div class="tabs" id="tabs">
      <button id="tabProj" class="on">项目</button>
      <button id="tabSess">会话</button>
    </div>
    <button class="btn" id="btnScan" title="重新扫描">⟳ 扫描</button>
    <button class="btn" id="btnClean" title="勾选所有超过清理阈值天数的会话">一键清理过期</button>
    <button class="btn" id="btnSettings" title="设置">⚙ 设置</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="layout">
    <div class="main">
      <div class="scroll" id="list"></div>
      <div class="selbar" id="selbar" hidden>
        <span id="selCount"></span>
        <span class="hint" id="selHint"></span>
        <span class="sp"></span>
        <button class="btn danger" id="btnDelSel" disabled>删除所选</button>
      </div>
      <div class="foot" id="foot"></div>
    </div>
    <div class="panel" id="panel" hidden></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

// ---------- 状态 ----------
let projects = [];
let sessions = [];
let settings = null;
let tab = 'proj';           // proj | sess
let selection = new Set();  // 已勾选的 item.id
let collapsed = new Set();  // 折叠的分组
let scanning = false;
let scanSummary = null;
let lastScanAt = null;

const AGENT_LABEL = { pi: 'pi', claude: 'Claude', codex: 'Codex', orca: 'Orca' };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// ---------- 主题 ----------
const THEME_ORDER = ['system', 'light', 'dark'];
const THEME_ICON = { system: '◐', light: '☀', dark: '☾' };
let theme = 'system';
function paintTheme() {
  $('btnTheme').textContent = THEME_ICON[theme] ?? '◐';
  const next = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
  $('btnTheme').title = `主题：${theme}（点击切到${next}）`;
}
$('btnTheme').onclick = async () => {
  const next = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
  theme = (await window.wsCleaner.setSettings({ theme: next }))?.theme ?? next;
  paintTheme();
};
$('btnMin').onclick = () => window.wsCleaner.minimize();
$('btnQuit').onclick = () => window.wsCleaner.quit();

// ---------- 工具函数 ----------
const ago = (ts) => {
  if (ts == null) return '—';
  const d = Math.max(0, Date.now() / 1000 - ts);
  if (d < 90) return `${Math.round(d)} 秒前`;
  if (d < 5400) return `${Math.round(d / 60)} 分钟前`;
  if (d < 86400 * 2) return `${(d / 3600).toFixed(1)} 小时前`;
  return `${Math.round(d / 86400)} 天前`;
};
const daysOld = (ts) => ts == null ? null : Math.floor((Date.now() / 1000 - ts) / 86400);
const fmtBytes = (n) => {
  if (n == null) return '—';
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
  if (n < 1073741824) return `${(n / 1048576).toFixed(1)} MB`;
  return `${(n / 1073741824).toFixed(2)} GB`;
};
const uid = (it) => it.kind === 'session' ? `s:${it.agent}:${it.path}` : `p:${it.path}`;
const locked = (it) => it.inUse || (it.kind === 'session' && it.agent === 'orca');

// ---------- 渲染 ----------
function projRows() {
  const rows = projects.map((p) => {
    const id = uid(p);
    const tags = [];
    if (p.isWorktree) tags.push(`<span class="tag wt">worktree</span>`);
    if (p.inUse) tags.push(`<span class="tag busy">使用中</span>`);
    if (p.dirty) tags.push(`<span class="tag dirty">有改动</span>`);
    if (p.idle) tags.push(`<span class="tag idle">闲置 ${daysOld(p.lastActivityAt)} 天</span>`);
    const main = p.isWorktree && p.mainRepo ? `<span class="sub">主仓库 <b>${esc(p.mainRepo)}</b></span>` : '';
    const sub = p.branch ? `<span class="sub"><b>${esc(p.branch)}</b> · 最后活动 ${ago(p.lastActivityAt)} · ${p.sessionCount} 个会话${main}</span>` : main;
    return `<div class="item ${p.inUse ? 'locked' : ''}" data-id="${esc(id)}">
      <input type="checkbox" data-id="${esc(id)}" ${locked(p) ? 'disabled title="使用中，不可删除"' : ''} ${selection.has(id) ? 'checked' : ''}>
      <div class="meta">
        <div class="name"><span class="nm" title="${esc(p.path)}">${esc(p.name)}</span>${tags.join('')}</div>
        ${sub}
      </div>
      <div class="right">
        <span class="size" data-path="${esc(p.path)}" title="点按计算体积">体积 <span>${p.sizeBytes != null ? fmtBytes(p.sizeBytes) : '—'}</span></span>
        <button class="act del" data-del="${esc(id)}" ${locked(p) ? 'disabled' : ''} title="${p.isWorktree ? '硬删 worktree' : '移入系统回收站'}">${p.isWorktree ? '删除' : '回收站'}</button>
      </div>
    </div>`;
  });
  return rows.join('');
}

function sessGroups() {
  const byAgent = {};
  for (const s of sessions) { (byAgent[s.agent] ??= []).push(s); }
  return Object.keys(byAgent).map((agent) => {
    const list = byAgent[agent];
    const total = list.reduce((a, s) => a + (s.sizeBytes || 0), 0);
    const key = 'sess:' + agent;
    const isCollapsed = collapsed.has(key);
    const rows = list.map((s) => {
      const id = uid(s);
      const tags = [];
      if (s.inUse) tags.push(`<span class="tag busy">使用中</span>`);
      if (s.idle) tags.push(`<span class="tag idle">${daysOld(s.lastActivityAt)} 天</span>`);
      const pv = s.previewable ? `<button class="act" data-preview="${esc(id)}" title="查看会话历史">预览</button>` : `<span class="tag" title="orca 会话暂不支持预览">无预览</span>`;
      return `<div class="item ${s.inUse ? 'locked' : ''}" data-id="${esc(id)}">
        <input type="checkbox" data-id="${esc(id)}" ${locked(s) ? 'disabled title="使用中，不可删除"' : ''} ${selection.has(id) ? 'checked' : ''}>
        <div class="meta">
          <div class="name"><span class="nm" title="${esc(s.path)}">${esc(s.name)}</span>${tags.join('')}</div>
          <span class="sub">${esc(s.path)}</span>
        </div>
        <div class="right">
          <span>${fmtBytes(s.sizeBytes)}</span>
          ${pv}
          <button class="act del" data-del="${esc(id)}" ${locked(s) ? 'disabled' : ''}>删除</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="group">
      <div class="group-head ${isCollapsed ? 'collapsed' : ''}" data-group="${esc(key)}">
        <span class="caret">▾</span><span>${AGENT_LABEL[agent] ?? agent}</span>
        <span class="count">${list.length} 个 · ${fmtBytes(total)}</span>
      </div>
      <div class="group-body" ${isCollapsed ? 'hidden' : ''}>${rows || '<div class="empty">无</div>'}</div>
    </div>`;
  }).join('');
}

function render() {
  const list = $('list');
  const isEmpty = (tab === 'proj' ? projects : sessions).length === 0;
  if (isEmpty && scanning) {
    list.innerHTML = '<div class="empty">正在扫描……</div>';
  } else if (isEmpty) {
    list.innerHTML = '<div class="empty">没有发现条目。点击「扫描」重新扫描，或在设置里添加根目录。</div>';
  } else {
    list.innerHTML = tab === 'proj' ? projRows() : sessGroups();
  }

  // 汇总
  const wt = projects.filter((p) => p.isWorktree).length;
  const inUse = projects.filter((p) => p.inUse).length;
  $('summary').innerHTML = tab === 'proj'
    ? `<span><b>${projects.length}</b> 项目（含 <b>${wt}</b> worktree）· <b>${inUse}</b> 使用中 · <b>${projects.filter((p) => p.idle).length}</b> 闲置</span>`
    : `<span><b>${sessions.length}</b> 会话 · <b>${sessions.filter((s) => s.inUse).length}</b> 使用中 · 共 <b>${fmtBytes(sessions.reduce((a, s) => a + (s.sizeBytes || 0), 0))}</b></span>`;

  // 选择条
  const sel = selectedItems();
  const n = sel.length;
  $('selbar').hidden = n === 0;
  if (n) {
    const nProj = sel.filter((i) => i.kind === 'project').length;
    const nWt = sel.filter((i) => i.kind === 'worktree').length;
    const nSess = sel.filter((i) => i.kind === 'session').length;
    $('selCount').textContent = `已选 ${n} 项（项目 ${nProj} · worktree ${nWt} · 会话 ${nSess}）`;
    $('selHint').textContent = nProj ? '项目删除将移入系统回收站' : '';
    $('btnDelSel').disabled = false;
  } else {
    $('btnDelSel').disabled = true;
  }

  // 页脚
  const foot = [];
  if (scanSummary) foot.push(`${scanSummary.projects} 项目 · ${scanSummary.worktrees} worktree · ${scanSummary.sessions} 会话`);
  if (lastScanAt) foot.push(`扫描于 ${ago(lastScanAt)}`);
  if (settings) foot.push(`闲置阈值 ${settings.idleDays} 天 · 清理阈值 ${settings.cleanupDays} 天`);
  $('foot').innerHTML = foot.join(' · ');
}

function selectedItems() {
  return [...selection].map((id) => findItem(id)).filter(Boolean);
}
function findItem(id) {
  for (const p of projects) if (uid(p) === id) return p;
  for (const s of sessions) if (uid(s) === id) return s;
  return null;
}

// ---------- 事件委托 ----------
$('list').addEventListener('click', async (e) => {
  const cb = e.target.closest('input[type=checkbox]');
  if (cb) {
    const id = cb.dataset.id;
    if (cb.checked) selection.add(id); else selection.delete(id);
    render();
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    const it = findItem(del.dataset.del);
    if (it) await requestDelete([it]);
    return;
  }
  const pv = e.target.closest('[data-preview]');
  if (pv) {
    const it = findItem(pv.dataset.preview);
    if (it) openPreview(it);
    return;
  }
  const gh = e.target.closest('[data-group]');
  if (gh) {
    const key = gh.dataset.group;
    if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
    render();
    return;
  }
  const sizeEl = e.target.closest('.size');
  if (sizeEl && !sizeEl.dataset.done) {
    sizeEl.dataset.done = '1';
    const p = projects.find((x) => x.path === sizeEl.dataset.path);
    if (p) {
      sizeEl.innerHTML = '计算中…';
      try {
        p.sizeBytes = await window.wsCleaner.size(p.path);
        render();
      } catch { sizeEl.dataset.done = ''; sizeEl.innerHTML = '体积 <span>—</span>'; }
    }
  }
});

// ---------- 删除流程 ----------
async function requestDelete(items) {
  const projectsList = items.filter((i) => i.kind === 'project');
  const worktrees = items.filter((i) => i.kind === 'worktree');
  const sessions = items.filter((i) => i.kind === 'session');

  // 删除前校验：项目删除永远要弹确认（Q2），其余按 skipConfirm 规则
  const needConfirm = projectsList.length > 0 || (worktrees.length + sessions.length > 0 && !settings.skipConfirm);
  let force = false;
  let confirmed = false;

  if (needConfirm) {
    const res = await openConfirmModal({ items, settings, projectsList, worktrees, sessions });
    if (!res) return;
    confirmed = true;
    force = res.force;
  } else {
    confirmed = true; // 免确认模式
  }
  if (!confirmed) return;

  // 组装执行载荷
  const payload = items.map((it) => {
    if (it.kind === 'worktree') return { kind: 'worktree', path: it.path, name: it.name, mainRepo: it.mainRepo, dirty: it.dirty, force };
    return { kind: it.kind, path: it.path, name: it.name };
  });
  setState('处理中…');
  const results = await window.wsCleaner.deleteItems(payload);
  selection.clear();
  const fails = results.filter((r) => !r.ok);
  if (fails.length) {
    setState(`${fails.length} 项失败`, 'err');
    toast(fails.map((f) => `✗ ${f.item.name}: ${f.message}`).join('<br>'));
  } else {
    setState('删除完成', 'ok');
    toast(`已删除 ${results.length} 项`);
  }
}

function openConfirmModal({ items, projectsList, worktrees, sessions }) {
  return new Promise((resolve) => {
    const mask = document.createElement('div');
    mask.className = 'mask';
    const hasProjects = projectsList.length > 0;
    const dirtyWts = worktrees.filter((w) => w.dirty);
    const hasDirty = dirtyWts.length > 0;
    const listHtml = items.map((it) =>
      `<div class="li"><b>${esc(it.name)}</b> <span class="path">${esc(it.path)}</span>${it.kind === 'worktree' && it.dirty ? ' <span class="tag dirty">有改动</span>' : ''}${it.kind === 'project' ? ' <span class="tag ok">→回收站</span>' : ''}${it.kind === 'session' ? ' <span class="tag">硬删</span>' : ''}</div>`
    ).join('');

    const warnings = [];
    if (hasProjects) warnings.push(`项目删除将<b>移入系统回收站</b>（可恢复）。若有登记在案的 worktree，会一并移入回收站。`);
    if (hasDirty) warnings.push(`有 <b>${dirtyWts.length}</b> 个工作树存在未提交改动，删除会丢弃这些改动。`);

    mask.innerHTML = `<div class="modal">
      <h3>确认删除 ${items.length} 项？</h3>
      ${warnings.map((w) => `<div class="m-warn">${w}</div>`).join('')}
      <div class="m-list">${listHtml}</div>
      <div class="m-row">
        <label>${hasDirty
          ? `<input type="checkbox" id="cForce"> 强制删除上述工作树（丢弃未提交改动）`
          : `<input type="checkbox" id="cForce" style="display:none">`}
        </label>
      </div>
      ${hasProjects ? `<div class="m-row"><label><input type="checkbox" id="cConfirm"> <b style="color:var(--bad)">我确认删除这些项目（将移入系统回收站）</b></label></div>` : ''}
      <div class="m-btns">
        <button class="btn" id="mCancel">取消</button>
        <button class="btn danger" id="mOk" disabled>删除</button>
      </div>
    </div>`;
    document.body.appendChild(mask);

    const okBtn = mask.querySelector('#mOk');
    const cConfirm = mask.querySelector('#cConfirm');
    const cForce = mask.querySelector('#cForce');
    const check = () => {
      if (!hasProjects) { okBtn.disabled = false; return; }
      okBtn.disabled = !cConfirm.checked;
    };
    cConfirm?.addEventListener('change', check);
    cForce?.addEventListener('change', check);
    check();

    mask.querySelector('#mCancel').onclick = () => { mask.remove(); resolve(null); };
    okBtn.onclick = () => {
      mask.remove();
      resolve({ force: cForce?.checked ?? false });
    };
    mask.addEventListener('mousedown', (e) => { if (e.target === mask) { mask.remove(); resolve(null); } });
  });
}

// ---------- 预览 ----------
async function openPreview(item) {
  const panel = $('panel');
  panel.hidden = false;
  panel.innerHTML = '<div class="p-head"><div><div class="p-title">加载中…</div></div><button class="p-close" id="pClose">✕</button></div>';
  const data = await window.wsCleaner.preview(item.path, item.agent).catch((e) => ({ previewable: false, message: String(e) }));
  if (!data?.previewable) {
    panel.innerHTML = `<div class="p-head"><div><div class="p-title">${esc(item.name)}</div></div><button class="p-close" id="pClose">✕</button></div>
      <div class="empty">${esc(data?.message || '无法预览')}</div>`;
    $('pClose').onclick = () => panel.hidden = true;
    return;
  }
  const hd = `<div class="p-head">
    <div>
      <div class="p-title">${esc(item.name)} <span class="tag">${AGENT_LABEL[item.agent]}</span></div>
      <div class="p-sub">${esc(data.path || '')}${data.cwd ? `<br>工作目录 <b>${esc(data.cwd)}</b>` : ''}</div>
      <div class="p-sub">${data.messageCount} 条消息 · ${data.startAt ? '开始 ' + esc(data.startAt) : ''} · ${data.endAt ? '结束 ' + esc(data.endAt) : ''}</div>
    </div>
    <button class="p-close" id="pClose" title="关闭">✕</button>
  </div>`;
  const msgs = (data.messages ?? []).map((m) => `
    <div class="msg">
      <div class="m-head"><span class="m-role ${m.role === 'user' ? 'user' : m.role === 'tool' ? 'tool' : 'assistant'}">${m.role}</span><span class="m-ts">${esc(m.ts || '')}</span></div>
      <div class="m-text">${esc(m.text)}</div>
    </div>`).join('');
  panel.innerHTML = hd + msgs + '<div style="padding:8px 12px" class="foot"><button class="act" id="pReveal">在资源管理器中显示</button></div>';
  $('pClose').onclick = () => panel.hidden = true;
  $('pReveal').onclick = () => window.wsCleaner.reveal(item.path);
}

// ---------- 一键清理 ----------
$('btnClean').onclick = async () => {
  const limit = settings.cleanupDays * 86400;
  const old = sessions.filter((s) => s.lastActivityAt != null && Date.now() / 1000 - s.lastActivityAt > limit && !s.inUse);
  if (!old.length) { toast('没有超过清理阈值的会话'); return; }
  selection = new Set(old.map((s) => uid(s)));
  render();
  toast(`已勾选 ${old.length} 个超过 ${settings.cleanupDays} 天的会话，点击「删除所选」`);
};

// ---------- 设置 ----------
$('btnSettings').onclick = () => openSettingsModal();
function openSettingsModal() {
  const mask = document.createElement('div');
  mask.className = 'mask';
  const sr = settings.sessionRoots || {};
  const rootsList = settings.roots.map((r, i) => `<div class="m-row"><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(r)}</span><button class="act del" data-rmroot="${i}">移除</button></div>`).join('');
  mask.innerHTML = `<div class="modal" style="width:520px">
    <h3>设置</h3>
    <div class="fld"><div class="lbl">扫描根目录（找 git 项目/worktree）</div>
      ${rootsList}
      <div class="fld-row"><input type="text" id="setRoot" placeholder="如 D:\\work"><button class="btn" id="addRoot">添加</button></div>
    </div>
    <div class="fld"><div class="lbl">会话存储</div>
      ${Object.entries(sr).map(([agent, cfg]) => `<div class="m-row"><label><input type="checkbox" data-agent="${agent}" ${cfg.enabled ? 'checked' : ''}> ${AGENT_LABEL[agent] ?? agent}</label><span style="font-size:10px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis">${esc(cfg.path)}</span></div>`).join('')}
    </div>
    <div class="fld"><div class="lbl">闲置阈值（天，仅标记不自动删）</div>
      <input type="number" id="setIdle" min="1" value="${settings.idleDays}"></div>
    <div class="fld"><div class="lbl">一键清理阈值（天，勾选更老的会话）</div>
      <input type="number" id="setClean" min="1" value="${settings.cleanupDays}"></div>
    <div class="fld"><div class="lbl">使用中判定窗口（分钟）</div>
      <input type="number" id="setInUse" min="1" value="${settings.inUseMin}"></div>
    <div class="m-row"><label><input type="checkbox" id="setSkip" ${settings.skipConfirm ? 'checked' : ''}> 删除前不再二次确认（仅 worktree / 会话；项目删除始终要确认）</label></div>
    <div class="m-btns">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存并重扫</button>
    </div>
  </div>`;
  document.body.appendChild(mask);

  mask.querySelector('#addRoot').onclick = () => {
    const v = mask.querySelector('#setRoot').value.trim();
    if (v && !settings.roots.includes(v)) { settings.roots.push(v); openSettingsModal(); mask.remove(); }
  };
  mask.querySelectorAll('[data-rmroot]').forEach((b) => b.onclick = () => {
    settings.roots.splice(Number(b.dataset.rmroot), 1);
    openSettingsModal(); mask.remove();
  });
  mask.querySelector('#mCancel').onclick = () => mask.remove();
  mask.querySelector('#mSave').onclick = async () => {
    const newSr = {};
    for (const [agent, cfg] of Object.entries(settings.sessionRoots)) {
      const el = mask.querySelector(`[data-agent="${agent}"]`);
      newSr[agent] = { ...cfg, enabled: el?.checked ?? cfg.enabled };
    }
    settings = await window.wsCleaner.setSettings({
      roots: settings.roots,
      sessionRoots: newSr,
      idleDays: Number(mask.querySelector('#setIdle').value) || 90,
      cleanupDays: Number(mask.querySelector('#setClean').value) || 30,
      inUseMin: Number(mask.querySelector('#setInUse').value) || 15,
      skipConfirm: mask.querySelector('#setSkip').checked,
    });
    mask.remove();
    startScan(true);
  };
}

// ---------- 扫描 ----------
function setState(label, cls = '') {
  const st = $('state');
  st.textContent = label;
  st.className = 'badge' + (cls ? ' ' + cls : '');
}
function startScan(force = false) {
  scanning = true;
  setState(scanning ? '扫描中…' : '就绪', 'busy');
  render();
  window.wsCleaner.scanStart();
}
$('btnScan').onclick = () => startScan(true);
$('tabProj').onclick = () => { tab = 'proj'; $('tabProj').classList.add('on'); $('tabSess').classList.remove('on'); render(); };
$('tabSess').onclick = () => { tab = 'sess'; $('tabProj').classList.remove('on'); $('tabSess').classList.add('on'); render(); };

window.wsCleaner.onCache((c) => {
  if (c?.projects) projects = c.projects;
  if (c?.sessions) sessions = c.sessions;
  lastScanAt = c?.summary?.scannedAt ?? null;
  scanSummary = c?.summary ?? null;
  render();
});
window.wsCleaner.onBatch(({ kind, items }) => {
  if (kind === 'projects') {
    for (const it of items) {
      const i = projects.findIndex((x) => x.path === it.path);
      if (i >= 0) projects[i] = it; else projects.push(it);
    }
  } else if (kind === 'sessions') {
    for (const it of items) {
      const i = sessions.findIndex((x) => x.agent === it.agent && x.path === it.path);
      if (i >= 0) sessions[i] = it; else sessions.push(it);
    }
  }
  render();
});
window.wsCleaner.onDone((p) => {
  scanning = false;
  lastScanAt = p.scannedAt;
  scanSummary = p.summary;
  setState(`就绪 · ${p.summary.projects} 项目 / ${p.summary.sessions} 会话`, 'ok');
  render();
});
window.wsCleaner.onError((p) => {
  scanning = false;
  setState('扫描出错', 'err');
  toast('扫描出错：' + p.message);
});

// ---------- toast ----------
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ---------- 启动 ----------
(async () => {
  settings = await window.wsCleaner.settings();
  theme = settings.theme ?? 'system';
  paintTheme();
  window.wsCleaner.version?.().then((v) => { if (v) $('ver').textContent = 'v' + v; }).catch(() => {});
  startScan();
})();
</script>
